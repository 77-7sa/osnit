const ALL_TOOLS=generateTools();
const TOTAL=ALL_TOOLS.length;

// ─── COMPONENTS ─────────────────────────────────────────────────────────────
function StarRating({r}){
  return <span style={{color:"#f59e0b",fontSize:"0.7rem",fontFamily:"JetBrains Mono"}}>{"★".repeat(Math.round(r))}{"☆".repeat(5-Math.round(r))} {r}</span>;
}

function ToolCard({tool,lang}){
  const[hover,setHover]=useState(false);
  return(
    <div onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      style={{background:hover?`linear-gradient(135deg,${tool.catColor}18,var(--card2))`:"var(--card)",
        border:`1px solid ${hover?tool.catColor+"66":"var(--border)"}`,borderRadius:14,
        padding:"1.1rem 1.2rem",cursor:"pointer",transition:"all 0.3s ease",
        transform:hover?"translateY(-4px) scale(1.01)":"none",
        boxShadow:hover?`0 12px 40px ${tool.catColor}22`:"none",
        display:"flex",flexDirection:"column",gap:"0.5rem",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",top:0,right:0,width:60,height:60,
        background:`radial-gradient(circle,${tool.catColor}18,transparent)`,borderRadius:"0 14px 0 60px"}}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <span style={{fontSize:"1.4rem"}}>{tool.catIcon}</span>
        <span style={{background:`${tool.catColor}22`,color:tool.catColor,fontSize:"0.6rem",
          padding:"2px 8px",borderRadius:20,fontFamily:"JetBrains Mono",border:`1px solid ${tool.catColor}44`}}>
          {tool.tags[0]}
        </span>
      </div>
      <div style={{fontWeight:700,fontSize:"0.9rem",color:"var(--text)"}}>{tool.name}</div>
      <div style={{fontSize:"0.75rem",color:"var(--text2)",lineHeight:1.5,flex:1}}>
        {tool.desc[lang]}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <StarRating r={tool.rating}/>
        <a href={tool.url} target="_blank" rel="noopener"
          style={{color:tool.catColor,fontSize:"0.7rem",fontFamily:"JetBrains Mono",
            textDecoration:"none",opacity:hover?1:0.5,transition:"opacity 0.2s"}}>
          {lang==="ar"?"فتح ←":"Open →"}
        </a>
      </div>
    </div>
  );
}

function CategoryChip({cat,active,onClick,lang}){
  return(
    <button onClick={onClick} style={{
      background:active?`linear-gradient(135deg,${cat.color}33,${cat.color}11)`:"transparent",
      border:`1px solid ${active?cat.color+"88":"var(--border)"}`,
      color:active?cat.color:"var(--text2)",borderRadius:40,
      padding:"0.45rem 1rem",cursor:"pointer",fontSize:"0.78rem",
      fontFamily:"Cairo",fontWeight:active?700:400,
      display:"flex",alignItems:"center",gap:"0.4rem",transition:"all 0.2s",
      whiteSpace:"nowrap"}}>
      <span>{cat.icon}</span>
      <span>{cat.label[lang]}</span>
      <span style={{background:active?cat.color+"44":"var(--card2)",borderRadius:20,
        padding:"1px 7px",fontSize:"0.65rem",color:active?cat.color:"var(--text3)"}}>
        {cat.count}
      </span>
    </button>
  );
}

function StatCard({icon,val,label,color}){
  return(
    <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,
      padding:"1.5rem",textAlign:"center",flex:1,minWidth:140,position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",top:-20,left:"50%",transform:"translateX(-50%)",
        width:80,height:80,borderRadius:"50%",background:`radial-gradient(${color}33,transparent)`}}/>
      <div style={{fontSize:"2rem",marginBottom:"0.3rem"}}>{icon}</div>
      <div style={{fontSize:"2rem",fontWeight:900,color,fontFamily:"JetBrains Mono",lineHeight:1}}>
        {val}
      </div>
      <div style={{fontSize:"0.75rem",color:"var(--text2)",marginTop:"0.3rem"}}>{label}</div>
    </div>
  );

            style={{background:"var(--card2)",border:"1px solid var(--border)",
              color:"var(--text)",borderRadius:8,padding:"0.4rem 0.7rem",
              cursor:"pointer",fontSize:"1rem"}}>
            {theme==="dark"?"☀️":"🌙"}
          </button>
          <button style={{background:"linear-gradient(135deg,#00d4ff,#7c3aed)",
            border:"none",color:"#fff",borderRadius:8,padding:"0.5rem 1.2rem",
            cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:"0.85rem"}}>
            {tx.explore}
          </button>
        </div>
      </nav>

      {/* ── HERO ── */}
      <section style={{paddingTop:120,paddingBottom:80,
        background:"linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%)",
        position:"relative",overflow:"hidden"}}>
        {/* bg grid */}
        <div style={{position:"absolute",inset:0,opacity:0.05,
          backgroundImage:"linear-gradient(#00d4ff 1px,transparent 1px),linear-gradient(90deg,#00d4ff 1px,transparent 1px)",
          backgroundSize:"40px 40px"}}/>
        {/* glow orbs */}
        <div style={{position:"absolute",top:"-10%",right:"10%",width:400,height:400,
          borderRadius:"50%",background:"radial-gradient(#7c3aed44,transparent 70%)",
          filter:"blur(60px)"}}/>
        <div style={{position:"absolute",bottom:"-10%",left:"5%",width:300,height:300,
          borderRadius:"50%",background:"radial-gradient(#00d4ff33,transparent 70%)",
          filter:"blur(60px)"}}/>

        <div style={{maxWidth:1280,margin:"0 auto",padding:"0 2rem",
          display:"flex",alignItems:"center",justifyContent:"space-between",gap:"3rem"}}>
          <div style={{flex:1,zIndex:1}}>
            <div style={{display:"inline-flex",alignItems:"center",gap:"0.6rem",
              background:"#00d4ff11",border:"1px solid #00d4ff44",borderRadius:40,
              padding:"0.4rem 1rem",marginBottom:"1.5rem"}}>
              <span style={{width:8,height:8,borderRadius:"50%",background:"#00d4ff",
                boxShadow:"0 0 10px #00d4ff"}}/>
              <span style={{color:"#00d4ff",fontSize:"0.75rem",fontFamily:"JetBrains Mono"}}>
                {lang==="ar"?"منصة OSINT المتكاملة":"Integrated OSINT Platform"}
              </span>
            </div>
            <h1 style={{fontSize:"clamp(2rem,5vw,3.5rem)",fontWeight:900,lineHeight:1.15,
              marginBottom:"1rem"}}>
              {lang==="ar"?"اكتشف أدوات ":"Discover the "}
              <span style={{background:"linear-gradient(90deg,#00d4ff,#7c3aed)",
                WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
                {lang==="ar"?"OSINT":"OSINT Tools"}
              </span>
              <br/>{lang==="ar"?" المتكاملة":""}
            </h1>
            <p style={{color:"var(--text2)",fontSize:"1.05rem",maxWidth:500,
              lineHeight:1.7,marginBottom:"2rem"}}>{tx.tagline}</p>
            <div style={{display:"flex",gap:"1rem",flexWrap:"wrap"}}>
              <button style={{background:"linear-gradient(135deg,#00d4ff,#0ea5e9)",
                border:"none",color:"#000",borderRadius:10,padding:"0.8rem 2rem",
                cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:"0.95rem",
                boxShadow:"0 8px 30px #00d4ff44"}}>
                {tx.explore}
              </button>
              <button style={{background:"transparent",border:"1px solid var(--border)",
                color:"var(--text)",borderRadius:10,padding:"0.8rem 2rem",
                cursor:"pointer",fontFamily:"Cairo",fontWeight:600,fontSize:"0.95rem"}}>
                {tx.learn}
              </button>
            </div>
            <div style={{marginTop:"2.5rem",display:"flex",alignItems:"center",gap:"1rem"}}>
              <div style={{display:"flex"}}>
                {["👨‍💻","👩‍💻","🕵️","👨‍🔬","👩‍🔬"].map((e,i)=>(
                  <div key={i} style={{width:36,height:36,borderRadius:"50%",
                    background:`linear-gradient(135deg,hsl(${i*60+200},70%,50%),hsl(${i*60+240},60%,40%))`,
                    border:"2px solid var(--bg)",display:"flex",alignItems:"center",
                    justifyContent:"center",marginLeft:i?-10:0,fontSize:"1rem"}}>{e}</div>
                ))}
              </div>
              <span style={{color:"var(--text2)",fontSize:"0.82rem"}}>
                {lang==="ar"?"+12,000 باحث أمني يستخدم المنصة":"+12,000 security researchers use the platform"}
              </span>
            </div>
          </div>

          {/* Hero visual */}
          <div style={{flex:1,display:"flex",justifyContent:"center",alignItems:"center",
            position:"relative",zIndex:1}}>
            <div style={{width:320,height:320,position:"relative"}}>
              <div style={{position:"absolute",inset:0,borderRadius:"50%",
                background:"linear-gradient(135deg,#7c3aed44,#00d4ff22)",
                animation:"pulse 3s ease-in-out infinite",border:"1px solid #7c3aed44"}}/>
              <div style={{position:"absolute",inset:20,borderRadius:"50%",
                background:"linear-gradient(135deg,#00d4ff22,#7c3aed33)",
                animation:"pulse 3s ease-in-out infinite 0.5s"}}/>
              <div style={{position:"absolute",inset:"50%",transform:"translate(-50%,-50%)",
                width:120,height:120,borderRadius:24,
                background:"linear-gradient(135deg,#7c3aed,#00d4ff)",
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:"3rem",boxShadow:"0 0 60px #7c3aed66"}}>
                🔍
              </div>
              {/* Orbit icons */}
              {["🌐","📱","📧","🖼️","📍","₿"].map((ic,i)=>{
                const angle=(i/6)*360;
                const r=130;
                const x=Math.cos((angle-90)*Math.PI/180)*r+160-20;
                const y=Math.sin((angle-90)*Math.PI/180)*r+160-20;
                return(
                  <div key={i} style={{position:"absolute",left:x,top:y,
                    width:40,height:40,borderRadius:10,
                    background:"var(--card2)",border:"1px solid var(--border)",
                    display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.2rem",
                    boxShadow:"0 4px 20px #00000044"}}>
                    {ic}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </section>

      {/* ── STATS ── */}
      <section style={{padding:"3rem 2rem",maxWidth:1280,margin:"0 auto"}}>
        <div style={{display:"flex",gap:"1rem",flexWrap:"wrap"}}>
          {tx.stats.map(([icon,val,label])=>(
            <StatCard key={label} icon={icon} val={val} label={label} color="#00d4ff"/>
          ))}
        </div>
      </section>

      {/* ── FEATURES ── */}
      <section style={{padding:"2rem 2rem 4rem",maxWidth:1280,margin:"0 auto"}}>
        <div style={{textAlign:"center",marginBottom:"3rem"}}>
          <h2 style={{fontSize:"2rem",fontWeight:900,marginBottom:"0.5rem"}}>
            {lang==="ar"?"آمن وموثوق":"Secure & Reliable"}
          </h2>
          <p style={{color:"var(--text2)"}}>
            {lang==="ar"?"فريق دعم متخصص على مدار الساعة":"24/7 dedicated support team"}
          </p>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:"1.5rem"}}>
          {[
            {icon:"🌐",title:{ar:"شبكة بيانات ضخمة",en:"Massive Data Network"},
             desc:{ar:"الوصول إلى آلاف المصادر المفتوحة من مكان واحد",en:"Access thousands of open sources from one place"},color:"#00d4ff"},
            {icon:"⚡",title:{ar:"معالجة فائقة السرعة",en:"Ultra Fast Processing"},
             desc:{ar:"نتائج فورية مع محركات بحث متقدمة",en:"Instant results with advanced search engines"},color:"#7c3aed"},
            {icon:"🛡️",title:{ar:"أمان مطلق",en:"Absolute Security"},
             desc:{ar:"جميع عمليات البحث مشفرة وخاصة",en:"All searches encrypted and private"},color:"#10b981"},
          ].map((f,i)=>(
            <div key={i} style={{background:"var(--card)",border:`1px solid ${f.color}33`,
              borderRadius:16,padding:"2rem",position:"relative",overflow:"hidden",
              transition:"transform 0.3s",cursor:"default"}}
              onMouseEnter={e=>e.currentTarget.style.transform="translateY(-5px)"}
              onMouseLeave={e=>e.currentTarget.style.transform="none"}>
              <div style={{position:"absolute",top:0,left:0,right:0,height:3,
                background:`linear-gradient(90deg,${f.color},transparent)`}}/>
              <div style={{width:56,height:56,borderRadius:14,
                background:`${f.color}22`,display:"flex",alignItems:"center",
                justifyContent:"center",fontSize:"1.8rem",marginBottom:"1rem",
                border:`1px solid ${f.color}44`}}>{f.icon}</div>
              <h3 style={{fontWeight:700,marginBottom:"0.5rem"}}>{f.title[lang]}</h3>
              <p style={{color:"var(--text2)",fontSize:"0.85rem",lineHeight:1.6}}>{f.desc[lang]}</p>
              <a href="#" style={{color:f.color,fontSize:"0.78rem",display:"inline-block",
                marginTop:"1rem",textDecoration:"none",fontFamily:"JetBrains Mono"}}>
                {lang==="ar"?"ابدأ الآن →":"Get Started →"}
              </a>
            </div>
          ))}
        </div>
      </section>

      {/* ── TOOLS SECTION ── */}
      <section style={{padding:"2rem",maxWidth:1280,margin:"0 auto",paddingBottom:"5rem"}}>
        <div style={{textAlign:"center",marginBottom:"2rem"}}>
          <h2 style={{fontSize:"2rem",fontWeight:900,marginBottom:"0.5rem"}}>
            {lang==="ar"?"مكتبة أدوات OSINT":"OSINT Tools Library"}
          </h2>
          <p style={{color:"var(--text2)"}}>
            {lang==="ar"?`${TOTAL} أداة متخصصة في ${CATEGORIES.length} فئة`:`${TOTAL} specialized tools across ${CATEGORIES.length} categories`}
          </p>
        </div>

        {/* Search */}
        <div style={{position:"relative",maxWidth:600,margin:"0 auto 2rem"}}>
          <input value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}}
            placeholder={tx.search}
            style={{width:"100%",background:"var(--card)",border:"1px solid var(--border)",
              borderRadius:12,padding:"0.85rem 3rem 0.85rem 1.2rem",color:"var(--text)",
              fontSize:"0.9rem",fontFamily:"Cairo",outline:"none",transition:"border 0.2s"}}
            onFocus={e=>e.target.style.borderColor="#00d4ff"}
            onBlur={e=>e.target.style.borderColor="var(--border)"}/>
          <span style={{position:"absolute",top:"50%",transform:"translateY(-50%)",
            right:lang==="ar"?"auto":"1rem",left:lang==="ar"?"1rem":"auto",
            fontSize:"1.1rem",opacity:0.5}}>🔍</span>
        </div>

        {/* Category filter */}
        <div style={{display:"flex",gap:"0.5rem",flexWrap:"wrap",marginBottom:"2rem",
          justifyContent:"center"}}>
          <button onClick={()=>{setActiveCat("all");setPage(1);}}
            style={{background:activeCat==="all"?"linear-gradient(135deg,#00d4ff33,#7c3aed22)":"transparent",
              border:`1px solid ${activeCat==="all"?"#00d4ff88":"var(--border)"}`,
              color:activeCat==="all"?"#00d4ff":"var(--text2)",borderRadius:40,
              padding:"0.45rem 1.2rem",cursor:"pointer",fontSize:"0.78rem",fontFamily:"Cairo",fontWeight:700}}>
            {tx.all} ({TOTAL})
          </button>
          {CATEGORIES.map(cat=>(
            <CategoryChip key={cat.id} cat={cat} active={activeCat===cat.id}
              onClick={()=>{setActiveCat(cat.id);setPage(1);}} lang={lang}/>
          ))}
        </div>

        {/* Results count */}
        <div style={{color:"var(--text3)",fontSize:"0.8rem",marginBottom:"1.5rem",
          fontFamily:"JetBrains Mono"}}>
          {lang==="ar"?`عرض ${visible.length} من ${filtered.length} أداة`:`Showing ${visible.length} of ${filtered.length} tools`}
        </div>

        {/* Tools grid */}
        <div style={{display:"grid",
          gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:"1rem"}}>
          {visible.map(t=><ToolCard key={t.id} tool={t} lang={lang}/>)}
        </div>

        {/* Pagination */}
        {totalPages>1&&(
          <div style={{display:"flex",justifyContent:"center",gap:"0.5rem",marginTop:"2.5rem",flexWrap:"wrap"}}>
            {Array.from({length:Math.min(totalPages,10)},(_,i)=>i+1).map(p=>(
              <button key={p} onClick={()=>{setPage(p);window.scrollTo(0,600);}}
                style={{width:38,height:38,borderRadius:8,border:"1px solid var(--border)",
                  background:page===p?"linear-gradient(135deg,#00d4ff,#7c3aed)":"var(--card)",
                  color:page===p?"#fff":"var(--text2)",cursor:"pointer",
                  fontFamily:"JetBrains Mono",fontWeight:700,fontSize:"0.85rem"}}>
                {p}
              </button>
            ))}
          </div>
        )}
      </section>

      {/* ── CTA SECTION ── */}
      <section style={{padding:"4rem 2rem",background:"var(--bg2)",borderTop:"1px solid var(--border)"}}>
        <div style={{maxWidth:1280,margin:"0 auto",
          display:"flex",alignItems:"center",justifyContent:"space-between",
          gap:"3rem",flexWrap:"wrap"}}>
          <div>
            <h2 style={{fontSize:"2.2rem",fontWeight:900,marginBottom:"0.8rem"}}>
              {lang==="ar"?<>تداول بثقة مع <span style={{color:"#00d4ff"}}>منصتنا</span><br/>السهلة الاستخدام</>
               :<>Trade intelligence with <span style={{color:"#00d4ff"}}>confidence</span><br/>and ease</>}
            </h2>
            <p style={{color:"var(--text2)",maxWidth:450,lineHeight:1.7,marginBottom:"1.5rem"}}>
              {lang==="ar"?"ابق على اطلاع بأحدث أدوات OSINT والتقنيات في مجال الأمن السيبراني. اتبع رؤانا لاتخاذ قرارات مستنيرة."
               :"Stay up-to-date with the latest OSINT tools and cybersecurity techniques. Follow our insights to make informed decisions."}
            </p>
            <button style={{background:"linear-gradient(135deg,#00d4ff,#7c3aed)",
              border:"none",color:"#fff",borderRadius:10,padding:"0.8rem 2rem",
              cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:"0.95rem",
              boxShadow:"0 8px 30px #7c3aed44"}}>
              {tx.explore}
            </button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:"1rem",minWidth:300}}>
            {[
              {icon:"🔐",label:{ar:"الوصول الآمن",en:"Secure Access"},color:"#10b981"},
              {icon:"⚡",label:{ar:"سرعة فائقة",en:"Lightning Fast"},color:"#f59e0b"},
              {icon:"🌐",label:{ar:"تغطية عالمية",en:"Global Coverage"},color:"#00d4ff"},
            ].map((f,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:"1rem",
                background:"var(--card)",border:`1px solid ${f.color}33`,borderRadius:12,padding:"1rem 1.2rem"}}>
                <div style={{width:44,height:44,borderRadius:10,background:`${f.color}22`,
                  display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.4rem"}}>
                  {f.icon}
                </div>
                <div>
                  <div style={{fontWeight:700,fontSize:"0.9rem"}}>{f.label[lang]}</div>
                  <div style={{color:"var(--text2)",fontSize:"0.75rem"}}>
                    {lang==="ar"?"متوفر على مدار الساعة":"Available 24/7"}
                  </div>
                </div>
                <div style={{marginLeft:"auto",color:f.color,fontSize:"1rem"}}>✓</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ── FOOTER ── */}
      <footer style={{background:"var(--bg)",borderTop:"1px solid var(--border)",
        padding:"3rem 2rem",color:"var(--text2)"}}>
        <div style={{maxWidth:1280,margin:"0 auto",
          display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:"2rem"}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:"0.8rem",marginBottom:"1rem"}}>
              <div style={{width:36,height:36,borderRadius:8,
                background:"linear-gradient(135deg,#00d4ff,#7c3aed)",
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:"1.1rem",fontWeight:900,color:"#fff",fontFamily:"JetBrains Mono"}}>Ø</div>
              <span style={{fontWeight:900,
                background:"linear-gradient(90deg,#00d4ff,#7c3aed)",
                WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>OSINT Tools</span>
            </div>
            <p style={{fontSize:"0.82rem",maxWidth:280,lineHeight:1.7}}>
              {lang==="ar"?"منصة الاستخبارات مفتوحة المصدر الأكثر شمولاً في العالم."
               :"The most comprehensive open source intelligence platform in the world."}
            </p>
          </div>
          {[
            {title:{ar:"الأدوات",en:"Tools"},links:["Shodan","Maltego","Sherlock","PhoneInfoga","Hunter.io"]},
            {title:{ar:"الفئات",en:"Categories"},links:[lang==="ar"?"شبكات":"Network",lang==="ar"?"اجتماعي":"Social",lang==="ar"?"نطاقات":"Domains",lang==="ar"?"تشفير":"Crypto"]},
            {title:{ar:"المنصة",en:"Platform"},links:[lang==="ar"?"عن المنصة":"About",lang==="ar"?"التوثيق":"Docs",lang==="ar"?"المدونة":"Blog",lang==="ar"?"تواصل":"Contact"]},
          ].map((col,i)=>(
            <div key={i}>
              <h4 style={{fontWeight:700,color:"var(--text)",marginBottom:"0.8rem",fontSize:"0.9rem"}}>{col.title[lang]}</h4>
              {col.links.map(l=>(
                <div key={l} style={{marginBottom:"0.4rem"}}>
                  <a href="#" style={{color:"var(--text2)",textDecoration:"none",fontSize:"0.82rem",
                    transition:"color 0.2s"}}
                    onMouseEnter={e=>e.target.style.color="#00d4ff"}
                    onMouseLeave={e=>e.target.style.color="var(--text2)"}>{l}</a>
                </div>
              ))}
            </div>
          ))}
        </div>
        <div style={{maxWidth:1280,margin:"2rem auto 0",paddingTop:"1.5rem",
          borderTop:"1px solid var(--border)",display:"flex",justifyContent:"space-between",
          flexWrap:"wrap",gap:"1rem",fontSize:"0.78rem"}}>
          <span>© 2025 OSINT Tools Platform. {lang==="ar"?"جميع الحقوق محفوظة.":"All rights reserved."}</span>
          <span style={{color:"var(--text3)",fontFamily:"JetBrains Mono"}}>
            {lang==="ar"?"للأغراض التعليمية فقط":"For educational purposes only"}
          </span>
        </div>
      </footer>

      <style>{`
        @keyframes pulse{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:var(--bg)}
        ::-webkit-scrollbar-thumb{background:var(--card2);border-radius:3px}
        input::placeholder{color:var(--text3)}
        *{transition:background 0.2s,border-color 0.2s,color 0.2s}
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
