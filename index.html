<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>OSINT Tools – منصة الاستخبارات المفتوحة المطورة</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07090f;
  --bg2:#0d1117;
  --bg3:#111827;
  --card:#131c2b;
  --card2:#1a2540;
  --accent:#00d4ff;
  --accent2:#7c3aed;
  --accent3:#10b981;
  --text:#e2e8f0;
  --text2:#94a3b8;
  --text3:#64748b;
  --border:#1e3a5f33;
  --glow:0 0 40px #00d4ff22;
}
[data-theme="light"]{
  --bg:#f0f4f8;
  --bg2:#e2e8f0;
  --bg3:#ffffff;
  --card:#ffffff;
  --card2:#f8fafc;
  --text:#0f172a;
  --text2:#475569;
  --text3:#94a3b8;
  --border:#cbd5e122;
}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
#root{min-height:100vh}

/* Modal Animations */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
  z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem;
  animation: fadeIn 0.2s ease-out;
}
.modal-content {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 20px;
  width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; position: relative;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--card2);border-radius:3px}
input::placeholder{color:var(--text3)}
select { appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: left 1rem top 50%; background-size: 0.65rem auto; }
[dir="ltr"] select { background-position: right 1rem top 50%; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;

// ─── DATA ───────────────────────────────────────────────────────────────────
const CATEGORIES=[
  {id:"network",icon:"🌐",color:"#00d4ff",label:{ar:"شبكات",en:"Network"},count:68},
  {id:"social",icon:"👤",color:"#7c3aed",label:{ar:"شبكات اجتماعية",en:"Social Media"},count:54},
  {id:"domain",icon:"🔍",color:"#10b981",label:{ar:"نطاقات وـIP",en:"Domain & IP"},count:47},
  {id:"exploit",icon:"⚡",color:"#eab308",label:{ar:"اختبار اختراق",en:"Pentest"},count:41},
  {id:"malware",icon:"🦠",color:"#dc2626",label:{ar:"تحليل برمجيات",en:"Malware"},count:22},
];

const PRICING_TYPES = ['free', 'freemium', 'paid'];

function generateTools(){
  const tools=[];
  const defs={
    network:[
      {name:"Shodan",desc:{ar:"محرك بحث الأجهزة المتصلة بالإنترنت",en:"IoT and connected device search engine"},url:"https://shodan.io",tags:["scanner","iot"],rating:4.9, pricing: 'freemium'},
      {name:"Nmap Online",desc:{ar:"فحص المنافذ عبر الإنترنت",en:"Online port scanner"},url:"https://nmap.online",tags:["scanner","ports"],rating:4.6, pricing: 'free'},
    ],
    social:[
      {name:"Sherlock",desc:{ar:"البحث عن اسم مستخدم عبر المنصات",en:"Hunt down social accounts by username"},url:"https://github.com/sherlock-project/sherlock",tags:["username"],rating:4.9, pricing: 'free'},
      {name:"Social-Analyzer",desc:{ar:"تحليل الملفات الشخصية",en:"API and CLI for analyzing social profiles"},url:"https://github.com/qeeqbox/social-analyzer",tags:["analysis"],rating:4.7, pricing: 'free'},
    ],
    domain:[
      {name:"Maltego",desc:{ar:"منصة استخبارات متكاملة",en:"Comprehensive intelligence platform"},url:"https://maltego.com",tags:["framework"],rating:4.9, pricing: 'freemium'},
      {name:"VirusTotal",desc:{ar:"تحليل الملفات والروابط",en:"Analyze files and URLs"},url:"https://virustotal.com",tags:["malware"],rating:4.9, pricing: 'free'},
    ],
    exploit:[
      {name:"Metasploit",desc:{ar:"إطار اختبار الاختراق",en:"Penetration testing framework"},url:"https://metasploit.com",tags:["framework"],rating:4.9, pricing: 'freemium'},
      {name:"Burp Suite",desc:{ar:"اختبار أمان تطبيقات الويب",en:"Web application security testing"},url:"https://portswigger.net",tags:["web"],rating:4.9, pricing: 'paid'},
    ],
    malware:[
      {name:"Any.run",desc:{ar:"تحليل البرامج الضارة التفاعلي",en:"Interactive malware sandbox"},url:"https://any.run",tags:["sandbox"],rating:4.9, pricing: 'freemium'},
    ]
  };
  
  let id=1;
  CATEGORIES.forEach(cat=>{
    const base=defs[cat.id]||[];
    const needed=cat.count;
    const allTools=[...base];
    while(allTools.length<needed){
      allTools.push({
        name:`${cat.label.en} Tool ${allTools.length+1}`,
        desc:{ar:`أداة ${cat.label.ar} متخصصة رقم ${allTools.length+1}`,en:`Specialized ${cat.label.en} tool #${allTools.length+1}`},
        url:"#",
        tags:[cat.id],
        rating:(3.8+Math.random()*1.1).toFixed(1)*1,
        pricing: PRICING_TYPES[Math.floor(Math.random() * PRICING_TYPES.length)]
      });
    }
    allTools.slice(0,needed).forEach(t=>{
      tools.push({...t,id:id++,category:cat.id,catColor:cat.color,catIcon:cat.icon});
    });
  });
  return tools;
}

const ALL_TOOLS=generateTools();
const TOTAL=ALL_TOOLS.length;

// ─── COMPONENTS ─────────────────────────────────────────────────────────────
function StarRating({r}){
  return <span style={{color:"#f59e0b",fontSize:"0.8rem",fontFamily:"JetBrains Mono"}}>{"★".repeat(Math.round(r))}{"☆".repeat(5-Math.round(r))} <span style={{color:"var(--text2)", marginLeft: 4}}>{r}</span></span>;
}

function PricingBadge({pricing, lang}) {
  const styles = {
    free: { bg: '#10b98122', col: '#10b981', ar: 'مجاني', en: 'Free' },
    freemium: { bg: '#f59e0b22', col: '#f59e0b', ar: 'مجاني جزئياً', en: 'Freemium' },
    paid: { bg: '#ef444422', col: '#ef4444', ar: 'مدفوع', en: 'Paid' }
  };
  const s = styles[pricing];
  return (
    <span style={{background: s.bg, color: s.col, padding: "2px 8px", borderRadius: 6, fontSize: "0.65rem", fontWeight: 700}}>
      {s[lang]}
    </span>
  );
}

// ─── MODAL COMPONENT (صفحة الأداة التفصيلية) ─────────────────────────────
function ToolModal({tool, onClose, lang, toggleFav, isFav}) {
  if(!tool) return null;
  
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-content" onClick={e=>e.stopPropagation()}>
        {/* Header Banner */}
        <div style={{height: 100, background: `linear-gradient(135deg, ${tool.catColor}33, var(--bg2))`, borderRadius: "20px 20px 0 0", position: "relative"}}>
          <button onClick={onClose} style={{position:"absolute", top: 15, left: lang==='ar'?15:'auto', right: lang==='ar'?'auto':15, background: "var(--card2)", border: "none", color: "var(--text)", width: 32, height: 32, borderRadius: "50%", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center"}}>✕</button>
        </div>
        
        {/* Body */}
        <div style={{padding: "0 2rem 2rem", position: "relative", top: -30}}>
          <div style={{display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: "1rem"}}>
            <div style={{width: 70, height: 70, borderRadius: 16, background: "var(--card)", border: `2px solid ${tool.catColor}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: "2rem", boxShadow: `0 8px 20px ${tool.catColor}33`}}>
              {tool.catIcon}
            </div>
            <div style={{display: "flex", gap: "0.5rem"}}>
              <button onClick={(e) => toggleFav(e, tool.id)} style={{background: "var(--card2)", border: "1px solid var(--border)", color: isFav ? "#f59e0b" : "var(--text2)", padding: "0.5rem 1rem", borderRadius: 10, cursor: "pointer", display: "flex", alignItems: "center", gap: "0.5rem", fontWeight: 600}}>
                {isFav ? '★' : '☆'} {lang === 'ar' ? (isFav ? 'محفوظة' : 'حفظ') : (isFav ? 'Saved' : 'Save')}
              </button>
              <a href={tool.url} target="_blank" rel="noopener noreferrer" style={{background: `linear-gradient(135deg, ${tool.catColor}, var(--accent2))`, border: "none", color: "#fff", padding: "0.5rem 1.5rem", borderRadius: 10, cursor: "pointer", fontWeight: 700, textDecoration: "none", display: "flex", alignItems: "center", gap: "0.5rem"}}>
                {lang === 'ar' ? 'تجربة مباشرة' : 'Live Demo'} ↗
              </a>
            </div>
          </div>

          <h2 style={{fontSize: "1.8rem", fontWeight: 900, marginBottom: "0.3rem"}}>{tool.name}</h2>
          <div style={{display: "flex", alignItems: "center", gap: "1rem", marginBottom: "1.5rem", flexWrap: "wrap"}}>
             <PricingBadge pricing={tool.pricing} lang={lang} />
             <StarRating r={tool.rating} />
             <span style={{color: "var(--text3)", fontSize: "0.8rem"}}>|</span>
             <span style={{background: `var(--card2)`, color: tool.catColor, fontSize: "0.75rem", padding: "3px 10px", borderRadius: 20, border: `1px solid ${tool.catColor}44`}}>
                #{tool.tags[0]}
             </span>
          </div>

          <p style={{color: "var(--text2)", lineHeight: 1.8, fontSize: "1rem", marginBottom: "2rem", paddingBottom: "2rem", borderBottom: "1px solid var(--border)"}}>
            {tool.desc[lang]}
            <br/><br/>
            {lang === 'ar' ? 'هذه الأداة تعتبر من أفضل الخيارات المتاحة حالياً للمحققين الأمنيين في مجال الـ OSINT. توفر واجهة برمجية متقدمة وقدرات بحث وتحليل عميقة تسهل عملية الاستخبارات.' : 'This tool is considered one of the best available options for security investigators in OSINT. It provides an advanced API and deep search and analysis capabilities.'}
          </p>

          <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: "2rem"}}>
            <div>
              <h3 style={{fontSize: "1.1rem", marginBottom: "1rem", color: tool.catColor}}>📘 {lang === 'ar' ? 'دليل الاستخدام السريع' : 'Quick Usage Guide'}</h3>
              <ul style={{color: "var(--text2)", fontSize: "0.9rem", lineHeight: 1.7, paddingInlineStart: "1.2rem"}}>
                <li>{lang === 'ar' ? 'قم بالتسجيل للحصول على مفتاح API.' : 'Register to get an API key.'}</li>
                <li>{lang === 'ar' ? 'استخدم وسائط البحث الدقيقة للفلترة.' : 'Use precise search arguments for filtering.'}</li>
                <li>{lang === 'ar' ? 'يمكن تصدير النتائج بصيغة JSON/CSV.' : 'Results can be exported in JSON/CSV.'}</li>
              </ul>
            </div>
            <div>
              <h3 style={{fontSize: "1.1rem", marginBottom: "1rem", color: tool.catColor}}>🔄 {lang === 'ar' ? 'بدائل مقترحة' : 'Suggested Alternatives'}</h3>
              <div style={{display: "flex", flexDirection: "column", gap: "0.5rem"}}>
                {["SpiderFoot", "Recon-ng", "theHarvester"].map(alt => (
                  <div key={alt} style={{background: "var(--card)", padding: "0.5rem 1rem", borderRadius: 8, fontSize: "0.85rem", border: "1px solid var(--border)"}}>
                    {alt}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── TOOL CARD COMPONENT ────────────────────────────────────────────────────
function ToolCard({tool, lang, toggleFav, isFav, viewMode, onClick}){
  const[hover,setHover]=useState(false);
  
  const isList = viewMode === 'list';

  return(
    <div onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} onClick={()=>onClick(tool)}
      style={{background:hover?`linear-gradient(135deg,${tool.catColor}12,var(--card2))`:"var(--card)",
        border:`1px solid ${hover?tool.catColor+"66":"var(--border)"}`,borderRadius:14,
        padding: isList ? "1rem 1.5rem" : "1.2rem", cursor:"pointer", transition:"all 0.3s ease",
        transform:hover && !isList ?"translateY(-4px) scale(1.01)":"none",
        boxShadow:hover?`0 12px 40px ${tool.catColor}15`:"none",
        display:"flex", flexDirection: isList ? "row" : "column", gap: isList ? "1.5rem" : "0.8rem", position:"relative", overflow:"hidden", alignItems: isList ? "center" : "stretch"}}>
      
      {!isList && <div style={{position:"absolute",top:0,right:0,width:60,height:60, background:`radial-gradient(circle,${tool.catColor}18,transparent)`,borderRadius:"0 14px 0 60px"}}/>}
      
      {/* Header / Icon */}
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", width: isList ? "auto" : "100%"}}>
        <div style={{width: isList ? 45 : 'auto', height: isList ? 45 : 'auto', borderRadius: 10, background: isList ? `${tool.catColor}15` : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: isList ? "1.2rem" : "1.6rem"}}>
          {tool.catIcon}
        </div>
        {!isList && (
          <button onClick={(e) => toggleFav(e, tool.id)} style={{background:"transparent", border:"none", cursor:"pointer", fontSize:"1.2rem", color: isFav ? "#f59e0b" : "var(--text3)", zIndex: 2}}>
            {isFav ? '★' : '☆'}
          </button>
        )}
      </div>

      {/* Content */}
      <div style={{flex: 1}}>
        <div style={{display: "flex", alignItems: "center", gap: "0.5rem", marginBottom: "0.3rem"}}>
          <div style={{fontWeight:700,fontSize:"1rem",color:"var(--text)"}}>{tool.name}</div>
          <PricingBadge pricing={tool.pricing} lang={lang} />
        </div>
        <div style={{fontSize:"0.8rem",color:"var(--text2)",lineHeight:1.5, display: "-webkit-box", WebkitLineClamp: isList ? 1 : 2, WebkitBoxOrient: "vertical", overflow: "hidden"}}>
          {tool.desc[lang]}
        </div>
      </div>

      {/* Footer / Meta */}
      <div style={{display:"flex", justifyContent: isList ? "flex-end" : "space-between", alignItems:"center", gap: isList ? "2rem" : "0", width: isList ? "auto" : "100%", marginTop: isList ? 0 : "auto", paddingTop: isList ? 0 : "0.5rem"}}>
        <StarRating r={tool.rating}/>
        {isList && (
          <button onClick={(e) => toggleFav(e, tool.id)} style={{background:"var(--card2)", border:"1px solid var(--border)", padding: "0.4rem 0.8rem", borderRadius: 8, cursor:"pointer", color: isFav ? "#f59e0b" : "var(--text2)", fontSize: "0.8rem"}}>
             {isFav ? '★ محفوظ' : '☆ حفظ'}
          </button>
        )}
      </div>
    </div>
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
function App(){
  const[lang,setLang]=useState("ar");
  const[theme,setTheme]=useState("dark");
  
  // ── المطوّر: حالات جديدة (فلاتر ومفضلة وتخطيط) ──
  const[search,setSearch]=useState("");
  const[activeCat,setActiveCat]=useState("all");
  const[priceFilter,setPriceFilter]=useState("all");
  const[viewMode,setViewMode]=useState("grid"); // grid, list
  const[favorites,setFavorites]=useState([]);
  const[selectedTool,setSelectedTool]=useState(null);

  useEffect(()=>{
    document.documentElement.setAttribute("data-theme",theme);
    document.documentElement.setAttribute("lang",lang);
    document.documentElement.setAttribute("dir",lang==="ar"?"rtl":"ltr");
  },[theme,lang]);

  const toggleFav = (e, id) => {
    e.stopPropagation();
    setFavorites(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  };

  const filtered=useMemo(()=>
    ALL_TOOLS.filter(t=>
      (activeCat==="all" || (activeCat==="favorites" ? favorites.includes(t.id) : t.category===activeCat))&&
      (priceFilter==="all" || t.pricing===priceFilter)&&
      (search===""||t.name.toLowerCase().includes(search.toLowerCase())||
       t.desc[lang].includes(search)||t.tags.some(g=>g.includes(search.toLowerCase())))
    ),[activeCat,search,lang, priceFilter, favorites]);

  const tx={
    ar:{title:"OSINT منصة", tagline:"محرك بحث ذكي وفلاتر متقدمة", search:"بحث بالاسم، الوصف أو الوسوم...", all:"الكل", fav:"المفضلة", price:"التسعير", allPrices:"جميع الخطط", grid:"شبكة", list:"قائمة"},
    en:{title:"OSINT Platform", tagline:"Smart search engine & advanced filters", search:"Search by name, desc, or tags...", all:"All", fav:"Favorites", price:"Pricing", allPrices:"All Plans", grid:"Grid", list:"List"}
  }[lang];

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)"}}>
      
      {/* ── NAVBAR ── */}
      <nav style={{position:"sticky",top:0,zIndex:100, background:"var(--bg)ee",backdropFilter:"blur(20px)", borderBottom:"1px solid var(--border)",padding:"0 2rem", display:"flex",alignItems:"center",justifyContent:"space-between",height:70}}>
        <div style={{display:"flex",alignItems:"center",gap:"0.8rem"}}>
          <div style={{width:40,height:40,borderRadius:12, background:"linear-gradient(135deg,#00d4ff,#7c3aed)", display:"flex",alignItems:"center",justifyContent:"center", fontSize:"1.2rem",fontWeight:900,color:"#fff",fontFamily:"JetBrains Mono"}}>Ø</div>
          <span style={{fontWeight:900,fontSize:"1.2rem", background:"linear-gradient(90deg,#00d4ff,#7c3aed)", WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
            {tx.title}
          </span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"0.8rem"}}>
          <button onClick={()=>setLang(l=>l==="ar"?"en":"ar")} style={{background:"var(--card2)",border:"1px solid var(--border)", color:"var(--text)",borderRadius:8,padding:"0.5rem 1rem", cursor:"pointer",fontSize:"0.8rem",fontFamily:"JetBrains Mono",fontWeight:700}}>
            {lang==="ar"?"EN":"AR"}
          </button>
        </div>
      </nav>

      {/* ── TOOL MODAL ── */}
      <ToolModal tool={selectedTool} onClose={()=>setSelectedTool(null)} lang={lang} toggleFav={toggleFav} isFav={selectedTool ? favorites.includes(selectedTool.id) : false} />

      {/* ── MAIN CONTENT ── */}
      <section style={{padding:"3rem 2rem",maxWidth:1300,margin:"0 auto"}}>
        
        {/* Header Dashboard Area */}
        <div style={{display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: "1rem", marginBottom: "2rem"}}>
           <div>
             <h1 style={{fontSize: "2.5rem", fontWeight: 900, marginBottom: "0.5rem"}}>{tx.title}</h1>
             <p style={{color: "var(--text2)", fontSize: "1rem"}}>{tx.tagline}</p>
           </div>
           <div style={{display: "flex", gap: "1rem", background: "var(--card)", padding: "1rem 1.5rem", borderRadius: 16, border: "1px solid var(--border)"}}>
              <div style={{textAlign: "center", paddingInlineEnd: "1.5rem", borderInlineEnd: "1px solid var(--border)"}}>
                <div style={{fontSize: "1.5rem", fontWeight: 900, color: "#00d4ff", fontFamily: "JetBrains Mono"}}>{TOTAL}</div>
                <div style={{fontSize: "0.75rem", color: "var(--text2)"}}>{lang==='ar'?'أداة':'Tools'}</div>
              </div>
              <div style={{textAlign: "center"}}>
                <div style={{fontSize: "1.5rem", fontWeight: 900, color: "#f59e0b", fontFamily: "JetBrains Mono"}}>{favorites.length}</div>
                <div style={{fontSize: "0.75rem", color: "var(--text2)"}}>{tx.fav}</div>
              </div>
           </div>
        </div>

        {/* ── SMART SEARCH & FILTERS BAR (النسخة المطورة) ── */}
        <div style={{background: "var(--card)", border: "1px solid var(--border)", padding: "1rem", borderRadius: 16, display: "flex", flexWrap: "wrap", gap: "1rem", alignItems: "center", marginBottom: "2rem", boxShadow: "0 10px 30px rgba(0,0,0,0.2)"}}>
          
          {/* Smart Search */}
          <div style={{flex: "1 1 300px", position: "relative"}}>
            <span style={{position:"absolute",top:"50%",transform:"translateY(-50%)", right:lang==="ar"?"1rem":"auto",left:lang==="ar"?"auto":"1rem", color: "var(--text2)"}}>🔍</span>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={tx.search}
              style={{width:"100%",background:"var(--bg2)",border:"1px solid var(--border)", borderRadius:10,padding: lang==='ar'?"0.8rem 2.8rem 0.8rem 1rem":"0.8rem 1rem 0.8rem 2.8rem",color:"var(--text)", fontSize:"0.95rem",fontFamily:"Cairo",outline:"none",transition:"border 0.2s"}}
              onFocus={e=>e.target.style.borderColor="#00d4ff"} onBlur={e=>e.target.style.borderColor="var(--border)"}/>
          </div>

          {/* Pricing Filter */}
          <div style={{display: "flex", alignItems: "center", gap: "0.5rem", background: "var(--bg2)", padding: "0.3rem", borderRadius: 10, border: "1px solid var(--border)"}}>
            <select value={priceFilter} onChange={e=>setPriceFilter(e.target.value)} style={{background: "transparent", border: "none", color: "var(--text)", padding: "0.5rem 2rem 0.5rem 1rem", outline: "none", fontFamily: "Cairo", fontSize: "0.9rem", cursor: "pointer"}}>
               <option value="all" style={{background: "var(--bg)"}}>{tx.allPrices}</option>
               <option value="free" style={{background: "var(--bg)"}}>{lang==='ar'?'مجاني':'Free'}</option>
               <option value="freemium" style={{background: "var(--bg)"}}>{lang==='ar'?'مجاني جزئياً':'Freemium'}</option>
               <option value="paid" style={{background: "var(--bg)"}}>{lang==='ar'?'مدفوع':'Paid'}</option>
            </select>
          </div>

          {/* Layout Toggle */}
          <div style={{display: "flex", background: "var(--bg2)", padding: "0.3rem", borderRadius: 10, border: "1px solid var(--border)"}}>
            <button onClick={()=>setViewMode('grid')} style={{background: viewMode==='grid'?"var(--card)":"transparent", color: viewMode==='grid'?"#00d4ff":"var(--text2)", border: "none", padding: "0.5rem 1rem", borderRadius: 8, cursor: "pointer", display: "flex", gap: "0.5rem", alignItems: "center", fontWeight: 600}}>
              <span>⊞</span> <span style={{fontSize: "0.85rem"}}>{tx.grid}</span>
            </button>
            <button onClick={()=>setViewMode('list')} style={{background: viewMode==='list'?"var(--card)":"transparent", color: viewMode==='list'?"#00d4ff":"var(--text2)", border: "none", padding: "0.5rem 1rem", borderRadius: 8, cursor: "pointer", display: "flex", gap: "0.5rem", alignItems: "center", fontWeight: 600}}>
              <span>≣</span> <span style={{fontSize: "0.85rem"}}>{tx.list}</span>
            </button>
          </div>
        </div>

        {/* ── CATEGORIES ── */}
        <div style={{display:"flex",gap:"0.6rem",flexWrap:"wrap",marginBottom:"2rem", borderBottom: "1px solid var(--border)", paddingBottom: "1.5rem"}}>
          <button onClick={()=>setActiveCat("all")} style={{background:activeCat==="all"?"linear-gradient(135deg,#00d4ff33,#7c3aed22)":"var(--card)", border:`1px solid ${activeCat==="all"?"#00d4ff88":"var(--border)"}`, color:activeCat==="all"?"#00d4ff":"var(--text2)",borderRadius:10, padding:"0.6rem 1.2rem",cursor:"pointer",fontSize:"0.85rem",fontFamily:"Cairo",fontWeight:600}}>
            {tx.all}
          </button>
          <button onClick={()=>setActiveCat("favorites")} style={{background:activeCat==="favorites"?"#f59e0b22":"var(--card)", border:`1px solid ${activeCat==="favorites"?"#f59e0b88":"var(--border)"}`, color:activeCat==="favorites"?"#f59e0b":"var(--text2)",borderRadius:10, padding:"0.6rem 1.2rem",cursor:"pointer",fontSize:"0.85rem",fontFamily:"Cairo",fontWeight:600, display: "flex", gap: "0.5rem", alignItems: "center"}}>
            ⭐ {tx.fav} <span style={{background: "var(--bg2)", padding: "1px 6px", borderRadius: 10, fontSize: "0.7rem"}}>{favorites.length}</span>
          </button>
          <div style={{width: "1px", background: "var(--border)", margin: "0 0.5rem"}}></div>
          {CATEGORIES.map(cat=>(
            <button key={cat.id} onClick={()=>setActiveCat(cat.id)} style={{background:activeCat===cat.id?`${cat.color}22`:"var(--card)", border:`1px solid ${activeCat===cat.id?cat.color+"88":"var(--border)"}`, color:activeCat===cat.id?cat.color:"var(--text2)",borderRadius:10, padding:"0.6rem 1.2rem",cursor:"pointer",fontSize:"0.85rem", fontFamily:"Cairo",fontWeight:600, display:"flex",alignItems:"center",gap:"0.5rem"}}>
              <span>{cat.icon}</span> <span>{cat.label[lang]}</span>
            </button>
          ))}
        </div>

        {/* ── TOOLS GRID/LIST ── */}
        {filtered.length === 0 ? (
          <div style={{textAlign: "center", padding: "4rem 2rem", color: "var(--text3)"}}>
            <div style={{fontSize: "3rem", marginBottom: "1rem"}}>🔍</div>
            <h3>{lang==='ar'?'لم يتم العثور على أدوات':'No tools found'}</h3>
            <p>{lang==='ar'?'حاول تغيير الفلاتر أو كلمات البحث':'Try changing your filters or search terms'}</p>
          </div>
        ) : (
          <div style={{display:"grid", gridTemplateColumns: viewMode === 'grid' ? "repeat(auto-fill,minmax(280px,1fr))" : "1fr", gap:"1.2rem"}}>
            {filtered.map(t=><ToolCard key={t.id} tool={t} lang={lang} toggleFav={toggleFav} isFav={favorites.includes(t.id)} viewMode={viewMode} onClick={setSelectedTool} />)}
          </div>
        )}

      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
